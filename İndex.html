<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 2048 Oyunu</title>
    <style>
        body {
            background-color: #faf8ef;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 340px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            color: #776e65;
            margin: 0;
        }
        .score-container {
            background: #bbada0;
            padding: 5px 15px;
            border-radius: 3px;
            color: #f9f6f2;
            text-align: center;
            font-weight: bold;
        }
        .score-label {
            font-size: 10px;
            text-transform: uppercase;
            display: block;
            color: #eee4da;
        }
        #score {
            font-size: 20px;
        }
        #game-container {
            width: 340px;
            height: 340px;
            background-color: #bbada0;
            border-radius: 6px;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            height: 100%;
        }
        .cell {
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.1s ease-in-out;
        }
        /* Karo Renkleri */
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 20px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 20px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 20px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 16px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 16px; }
        
        .game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(238, 228, 218, 0.73);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            display: none;
        }
        .game-over p { font-size: 30px; font-weight: bold; color: #776e65; margin-bottom: 20px; }
        .restart-btn {
            background: #8f7a66; border-radius: 3px; padding: 10px 20px;
            color: #fff; font-weight: bold; cursor: pointer; border: none;
        }
    </style>
</head>
<body>

    <div class="heading">
        <h1>2048</h1>
        <div class="score-container">
            <span class="score-label">SKOR</span>
            <span id="score">0</span>
        </div>
    </div>

    <div id="game-container">
        <div class="grid" id="grid"></div>
        <div class="game-over" id="game-over">
            <p>Oyun Bitti!</p>
            <button class="restart-btn" onclick="resetGame()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        let board = [];
        let score = 0;

        function startGame() {
            board = Array(16).fill(0);
            score = 0;
            scoreDisplay.innerText = score;
            gameOverScreen.style.display = 'none';
            gridContainer.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                let cell = document.createElement('div');
                cell.classList.add('cell');
                gridContainer.appendChild(cell);
            }
            generateTile();
            generateTile();
            updateBoard();
        }

        function generateTile() {
            let emptyCells = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
            if (emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, idx) => {
                cells[idx].className = 'cell'; 
                cells[idx].innerText = val === 0 ? '' : val;
                if (val > 0) cells[idx].classList.add(`tile-${val}`);
            });
            if (isGameOver()) {
                gameOverScreen.style.display = 'flex';
            }
        }

        function slide(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(direction) {
            let moved = false;
            let oldBoard = [...board];

            for (let i = 0; i < 4; i++) {
                let row = [];
                if (direction === 'left' || direction === 'right') {
                    row = board.slice(i * 4, i * 4 + 4);
                    if (direction === 'right') row.reverse();
                    let newRow = slide(row);
                    if (direction === 'right') newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i * 4 + j] = newRow[j];
                } else {
                    row = [board[i], board[i + 4], board[i + 8], board[i + 12]];
                    if (direction === 'down') row.reverse();
                    let newRow = slide(row);
                    if (direction === 'down') newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i + j * 4] = newRow[j];
                }
            }

            if (board.some((val, idx) => val !== oldBoard[idx])) {
                generateTile();
                scoreDisplay.innerText = score;
                updateBoard();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });

        function isGameOver() {
            if (board.includes(0)) return false;
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    let current = board[i * 4 + j];
                    if (j < 3 && current === board[i * 4 + j + 1]) return false;
                    if (i < 3 && current === board[(i + 1) * 4 + j]) return false;
                }
            }
            return true;
        }

        function resetGame() {
            startGame();
        }

        startGame();
    </script>
</body>
</html>
